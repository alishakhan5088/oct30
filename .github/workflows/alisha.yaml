name: myworkflow1
on:
  push:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
          whoami
          pwd
          cd
          docker --version
          docker compose version
      - name: mystep2-clone the repo in current work directory
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-build diocker image
        run: docker image build -t alisha/myimage_oct30:${{ github.run_number }} -f Dockerfile .
      - name: mystep5-check the docker image
        run: docker image ls 

